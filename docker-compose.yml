services:
  postgres:
    image: postgres:16-alpine
    container_name: lowroute-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lowroute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lowroute"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lowroute-postgres-data:/var/lib/postgresql/data

volumes:
  lowroute-postgres-data:
